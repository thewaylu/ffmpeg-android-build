name: Build FFmpeg 9.0.2 Single .so for Android arm64

on:
  push:
  workflow_dispatch:
    inputs:
      skip_libs:
        description: '临时排除的库（空格分隔，如：jxl placebo rav1e）'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            autoconf automake libtool libtool-bin autoconf-archive \
            cmake ninja-build nasm yasm pkg-config wget curl git unzip xz-utils \
            gawk patch file python3-pip python3-setuptools python3-wheel
          sudo pip3 install --upgrade meson
          meson --version; ninja --version; cmake --version | head -1

      - name: Install Rust (for librav1e)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache NDK + 已构建的库
        uses: actions/cache@v4
        with:
          path: |
            /tmp/ffbuild/ndk
            /tmp/ffbuild/src
            /tmp/ffbuild/install
            /tmp/ffbuild/done
          key: ffbuild-ndk27c-api24-v2-${{ hashFiles('build.sh') }}
          restore-keys: |
            ffbuild-ndk27c-api24-v2-
            ffbuild-

      - name: Build
        env:
          SKIP_LIBS: ${{ github.event.inputs.skip_libs }}
        run: |
          chmod +x build.sh
          set -o pipefail
          ./build.sh 2>&1 | tee /tmp/ffbuild-stdout.log

      - name: 失败时把日志尾部开成 issue（便于无 token 排查）
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (p, n) => { try { return fs.readFileSync(p, 'utf8').slice(-n); } catch (e) { return ''; } };
            // 优先发完整构建报告（含每个失败库的第一条错误行），再附 stdout 尾部
            let report = read('/tmp/ffbuild/build-report.txt', 40000);
            let stdout = read('/tmp/ffbuild-stdout.log', 6000);
            const body =
              (report ? `**构建报告：**\n\n\`\`\`\n${report}\n\`\`\`\n\n` : '') +
              (stdout ? `**stdout 尾部：**\n\n\`\`\`\n${stdout}\n\`\`\`\n\n` : (report ? '' : '(读不到日志文件)\n\n')) +
              `run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha.slice(0, 7);
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `CI 失败 ${sha} run#${context.runNumber} ${new Date().toISOString().slice(0,16)}Z`,
              body: body.slice(0, 62000),
              labels: ['ci-failure']
            });

      - name: Upload 单文件产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libffmpeg-android-arm64
          path: /tmp/ffbuild/install/lib/libffmpeg.so
          if-no-files-found: ignore

      - name: Upload 未 strip 版本（便于调试）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-unstripped
          path: /tmp/ffbuild/ffmpeg-unstripped
          if-no-files-found: ignore

      - name: Upload 构建报告与逐库日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: |
            /tmp/ffbuild/build-report.txt
            /tmp/ffbuild-stdout.log
            /tmp/ffbuild/logs
          if-no-files-found: ignore
